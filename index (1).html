<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack Day</title>
<style>
  :root{
    box-sizing:border-box;
    --bg:#f5f6f8; --surface:#ffffff; --ink:#1b1e2b; --muted:#666c80;
    --line:#e1e4ea; --accent:#2f3c7e; --accent-ink:#ffffff;
    --gold:#b8892b; --rare:#8a6d1f;
    --shadow:0 1px 2px rgba(18,20,38,.06),0 6px 18px rgba(18,20,38,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#13151d; --surface:#1c1f2c; --ink:#edeff5; --muted:#99a0b4;
      --line:#2b2f40; --accent:#8e9bd8; --accent-ink:#13151d;
      --gold:#e3bf6a; --rare:#e3bf6a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#13151d; --surface:#1c1f2c; --ink:#edeff5; --muted:#99a0b4;
    --line:#2b2f40; --accent:#8e9bd8; --accent-ink:#13151d;
    --gold:#e3bf6a; --rare:#e3bf6a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 60px}
  h1{font-size:1.5rem;line-height:1.2;margin:0 0 12px}
  h2{font-size:1.1rem;margin:0 0 10px}
  h3{font-size:.98rem;margin:18px 0 6px}
  p{margin:0 0 14px}
  .muted{color:var(--muted)} .small{font-size:.87rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;
    border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
    padding:13px 18px;width:100%}
  button.ghost{background:transparent;color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>button{flex:1 1 150px;width:auto}
  input[type=number],textarea{font:inherit;width:100%;padding:11px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  textarea{min-height:72px;resize:vertical}
  label{display:block;font-weight:600;margin:0 0 6px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-weight:400}
  .consent input{margin-top:4px;width:18px;height:18px;flex:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;
    padding:9px 13px;margin-bottom:14px;background:var(--surface);font-size:.9rem}
  .pill{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px}
  .packwrap{display:flex;flex-direction:column;align-items:center;padding:6px 0}
  .pack{width:min(200px,58vw);aspect-ratio:5/7;border-radius:14px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
  .pack.sealed{background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 60%, #000));
    color:var(--accent-ink);border-color:transparent}
  .pack .glyph{font-size:2.6rem;line-height:1;margin-bottom:12px}
  .pack .nm{font-weight:600;font-size:1rem}
  .pack .tag{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-top:8px;font-weight:700}
  .pack.hit{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 26%, transparent),var(--shadow)}
  .pack.hit .tag{color:var(--rare)}
  .flip{animation:flip .36s ease}
  @keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
  .setgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
  .mini{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;
    background:var(--bg)}
  .mini .g{font-size:1.5rem;line-height:1.1}
  .mini .n{font-size:.72rem;margin-top:5px;color:var(--muted);font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%, transparent)}
  .mini.hit .n{color:var(--rare)}
  .scale{display:flex;gap:6px}
  .scale button{flex:1;padding:12px 0;background:transparent;color:var(--ink);
    border-color:var(--line);font-weight:600}
  .scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}
  .dots{display:flex;gap:5px;margin-bottom:14px}
  .dots>i{flex:1;height:4px;border-radius:999px;background:var(--line)}
  .dots>i.done{background:var(--accent)}
  .dots>i.now{background:color-mix(in srgb,var(--accent) 55%, transparent)}
  .pid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.5rem;font-weight:700;
    text-align:center;letter-spacing:.08em;background:var(--bg);border:1px dashed var(--line);
    border-radius:10px;padding:14px;margin:4px 0 12px}
  .err{color:#b3261e;font-size:.86rem;margin-top:8px}
  @media (prefers-color-scheme: dark){.err{color:#f2b8b5}}
  .hide{display:none}
  .steps{counter-reset:s;padding:0;margin:0 0 4px;list-style:none}
  .steps>li{position:relative;padding-left:34px;margin-bottom:14px}
  .steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
    width:23px;height:23px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
    font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  table.sum,table.ladder{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
  table.sum td{padding:7px 2px;border-bottom:1px solid var(--line)}
  table.sum td:last-child{text-align:right;font-weight:600}
  table.sum tr.best td{color:var(--rare)}
  table.ladder th{font-size:.8rem;color:var(--muted);font-weight:600;padding:6px 4px;text-align:left}
  table.ladder td{padding:9px 4px;border-bottom:1px solid var(--line)}
  table.ladder td:first-child{font-weight:600;white-space:nowrap}
  .lab{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-weight:500}
  .lab input{width:17px;height:17px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script>
(function(){
  "use strict";

  /* ========================================================================
     CONFIG — every tunable number lives here.
     ===================================================================== */
  var CFG = {
    luckyValue:     40,   // tokens gained from the lucky card
    endowment:      20,   // tokens at the START of every round
    packPrice:      9,    // net EV of buying = (1/4 x 40) - 9 = +1
    practiceRounds: 2,
    scoredRounds:   5,
    ladderPrices:   [2,4,6,8,10,12,14,16],
    researcher:     "Lam",
    contactEmail:   "lamnguyen250509@gmail.com"
  };

  /* The set: four cards, exactly one of which is lucky.
     A pack holds one card drawn uniformly at random from these four, so the
     chance of the lucky card is exactly 1 in 4. Nothing is staged, weighted
     or sequenced — what the instructions say is literally what happens. */
  var CARDS = [
    { id:1, name:"Aurelion",    glyph:"👑", lucky:true  },
    { id:2, name:"Pebblemoth",  glyph:"🦋", lucky:false },
    { id:3, name:"Tidewhisker", glyph:"🐟", lucky:false },
    { id:4, name:"Barkling",    glyph:"🌿", lucky:false }
  ];
  var LUCKY = CARDS[0];

  function draw(){ return CARDS[Math.floor(Math.random() * CARDS.length)]; }

  /* ------------------------------------------------------------------------
     SAVE_URL — the Google Apps Script web-app URL.
     Leave empty to run in test mode: the game works and logs to the console.
     --------------------------------------------------------------------- */
  var SAVE_URL = "";

  /* ===================================================================== */

  var S = {
    player: String(Math.floor(1000 + Math.random() * 9000)),
    beliefStart: null,
    ladder: null,          // raw buy/keep choices from the elicitation
    switchPrice: null,     // lowest price at which they chose to keep
    consistent: null,      // single switching point or not
    rounds: [],
    beliefEnd: null,
    familiarity: null,
    comment: "",
    startedAt: new Date().toISOString(),
    finishedAt: null
  };

  var app = document.getElementById("app");
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function el(id){ return document.getElementById(id); }
  function go(fn){ app.innerHTML = ""; fn(); window.scrollTo(0,0); }

  /* ---------- shared pieces ---------- */

  function topbar(label, tokens){
    return '<div class="topbar"><span>' + label + '</span>' +
           '<span><b class="tok">' + tokens + '</b> tokens</span>' +
           '<span class="pill">P' + S.player + '</span></div>';
  }
  function dots(done, total){
    var out = '<div class="dots">';
    for (var i = 0; i < total; i++){
      out += '<i class="' + (i < done ? "done" : (i === done ? "now" : "")) + '"></i>';
    }
    return out + '</div>';
  }
  function sealedHTML(){
    return '<div class="pack sealed" id="pk"><div class="glyph">✦</div>' +
           '<div class="nm">Sealed pack</div></div>';
  }
  function cardHTML(c){
    return '<div class="pack flip' + (c.lucky ? ' hit' : '') + '" id="pk">' +
           '<div class="glyph">' + c.glyph + '</div>' +
           '<div class="nm">' + esc(c.name) + '</div>' +
           '<div class="tag">' + (c.lucky ? "Lucky card · +" + CFG.luckyValue + " tokens"
                                          : "Common · 0 tokens") + '</div></div>';
  }
  function setGrid(){
    return '<div class="setgrid">' + CARDS.map(function(c){
      return '<div class="mini' + (c.lucky ? ' hit' : '') + '">' +
             '<div class="g">' + c.glyph + '</div>' +
             '<div class="n">' + esc(c.name) + '</div></div>';
    }).join("") + '</div>';
  }
  function scaleHTML(attr){
    var out = '<div class="scale">';
    for (var i = 1; i <= 5; i++){
      out += '<button type="button" data-' + attr + '="' + i + '" aria-pressed="false">' + i + '</button>';
    }
    return out + '</div>';
  }
  function wireScale(attr, onPick){
    var btns = app.querySelectorAll("[data-" + attr + "]");
    Array.prototype.forEach.call(btns, function(b){
      b.onclick = function(){
        Array.prototype.forEach.call(btns, function(o){
          o.setAttribute("aria-pressed", o === b ? "true" : "false");
        });
        onPick(parseInt(b.getAttribute("data-" + attr), 10));
      };
    });
  }

  /* ---------- 1-4. Welcome ---------- */

  function screenWelcome(){
    app.innerHTML =
      '<div class="card">' +
      '<h1>Pack Day</h1>' +
      '<p>Thanks for taking part.</p>' +
      '<p>This is a short game, and it is part of a research project I am doing with the ' +
        'Cambridge Centre for International Research. My name is ' + CFG.researcher +
        ' and I am a student at UNIS Hanoi.</p>' +
      '<p>The research is about <strong>how people make decisions under risk and uncertainty</strong> ' +
        '— the kind of choice you make when you know the odds but not the outcome.</p>' +
      '<p>It takes about <strong>8 to 10 minutes</strong>.</p>' +
      '<p><strong>Taking part is completely voluntary.</strong> You can leave at any point by closing ' +
        'the page, and you do not need to give a reason. Nothing is saved unless you reach the end.</p>' +
      '<p><strong>Everything is anonymous.</strong> No name, email or anything else identifying you ' +
        'is collected at any stage.</p>' +
      '<p class="small muted">The cards in this game are invented for the study. No real trading cards appear.</p>' +
      '</div>' +
      '<div class="card"><button id="go">Continue</button></div>';
    el("go").onclick = function(){ go(screenConsent); };
  }

  /* ---------- 5. Consent ---------- */

  function screenConsent(){
    app.innerHTML =
      '<div class="card">' +
      '<h2>Before we start</h2>' +
      '<label class="consent"><input type="checkbox" id="c1">' +
        '<span>I have read the information on the previous page. I am taking part voluntarily, ' +
        'I know I can stop at any time, and I understand my answers are anonymous.</span></label>' +
      '<label class="consent"><input type="checkbox" id="c2">' +
        '<span><em>If you are under 18:</em> a parent or guardian has seen the information sheet ' +
        'shared with this link and is happy for me to take part.</span></label>' +
      '<div class="row">' +
        '<button id="yes" disabled>Start the game</button>' +
        '<button id="no" class="ghost">No thanks</button>' +
      '</div></div>';

    function sync(){ el("yes").disabled = !(el("c1").checked && el("c2").checked); }
    el("c1").onchange = sync;
    el("c2").onchange = sync;

    el("yes").onclick = function(){ go(screenRules); };
    el("no").onclick  = function(){
      app.innerHTML = '<div class="card"><h2>No problem</h2>' +
        '<p class="muted">Thanks for your time — you can close this page.</p></div>';
    };
  }

  /* ---------- 6. How it works ---------- */

  function screenRules(){
    app.innerHTML =
      '<div class="card"><h2>How it works</h2>' +

      '<h3>The cards</h3>' +
      '<p>There are only <strong>four cards</strong> in this game:</p>' +
      setGrid() +
      '<p><strong>' + esc(LUCKY.name) + ' is the lucky card.</strong> Getting it gains you ' +
        '<strong>' + CFG.luckyValue + ' tokens</strong>. The other three are commons and gain you ' +
        '<strong>nothing at all</strong>.</p>' +

      '<h3>The odds</h3>' +
      '<p>Every pack contains exactly one card, picked at random from those four.</p>' +
      '<p>So every pack has a <strong>1 in 4 chance (25%)</strong> of holding the lucky card — ' +
        'and that chance is <strong>exactly the same for every pack you ever open</strong>, ' +
        'no matter what you got before. Packs do not affect each other.</p>' +

      '<h3>What happens in each round</h3>' +
      '<p>You start every round with <strong>' + CFG.endowment + ' tokens</strong>. ' +
        'Each round has three steps:</p>' +
      '<ol class="steps">' +
        '<li><strong>You open your free pack.</strong> Every round you are given one pack at no ' +
          'cost. You open it and see which card is inside. If it is ' + esc(LUCKY.name) +
          ', you gain ' + CFG.luckyValue + ' tokens. If it is a common, you gain nothing.</li>' +
        '<li><strong>You decide.</strong> You can <em>keep your tokens</em> and end the round there, ' +
          'or <em>spend ' + CFG.packPrice + ' tokens</em> to buy one more pack.</li>' +
        '<li><strong>If you bought one, you open it.</strong> Same odds as always — 1 in 4 for ' +
          'the lucky card. If you get it you gain ' + CFG.luckyValue + ' tokens; if not you gain ' +
          'nothing. Either way the ' + CFG.packPrice + ' tokens are spent.</li>' +
      '</ol>' +
      '<p>Whatever tokens you hold at the end of step 3 is <strong>your score for that round</strong>.</p>' +

      '<h3>The rounds</h3>' +
      '<p>You will play <strong>' + CFG.scoredRounds + ' rounds</strong>, with ' +
        CFG.practiceRounds + ' practice rounds first that do not count.</p>' +
      '<p><strong>Every round starts fresh at ' + CFG.endowment + ' tokens.</strong> Nothing carries ' +
        'over — a bad round cannot hurt a later one, and a good one does not help. Each round ' +
        'is scored on its own.</p>' +

      '<h3>Your goal</h3>' +
      '<p>End each round with as many tokens as you can.</p>' +

      '<h3>The competition</h3>' +
      '<p>Everyone who plays is entered. You will get a <strong>player number</strong> on the next ' +
        'screen — that is how scores are told apart, since no names are collected. The highest ' +
        'score wins a <strong>voucher</strong>, and the winning number will be posted where you got ' +
        'this link.</p>' +
      '</div>' +
      '<div class="card"><button id="go">Continue</button></div>';
    el("go").onclick = function(){ go(screenPlayer); };
  }

  /* ---------- 7. Player number ---------- */

  function screenPlayer(){
    app.innerHTML =
      '<div class="card"><h2>Your player number</h2>' +
      '<div class="pid">P' + S.player + '</div>' +
      '<p>This is yours for the whole game. Write it down or screenshot it — if it wins, ' +
        'you will need it to claim the voucher.</p>' +
      '<p class="small muted">It was generated just now and is not linked to your name ' +
        'or to anything else about you.</p>' +
      '</div>' +
      '<div class="card"><button id="go">Continue</button></div>';
    el("go").onclick = function(){ go(screenCheck); };
  }

  /* ---------- 8. Comprehension check / baseline belief ---------- */

  function screenCheck(){
    app.innerHTML =
      '<div class="card"><h2>Quick check</h2>' +
      '<label for="b">Out of 100 packs, how many would you expect to contain the lucky card?</label>' +
      '<input id="b" type="number" min="0" max="100" inputmode="numeric" placeholder="0–100">' +
      '<div id="e" class="err hide">Enter a number between 0 and 100.</div>' +
      '</div>' +
      '<div class="card"><button id="go">Continue</button></div>';
    el("go").onclick = function(){
      var v = parseInt(el("b").value, 10);
      if (isNaN(v) || v < 0 || v > 100){ el("e").classList.remove("hide"); return; }
      S.beliefStart = v;
      go(screenLadder);
    };
  }

  /* ---------- 9. Risk elicitation ----------
     The same lottery they will face, offered at a range of prices. Their
     switching point is a certainty equivalent for that exact gamble, giving a
     per-person prediction for every later decision. This is the rational
     benchmark: whatever their risk preference is, it should not change
     between rounds, and the first pack should not move it.
  ------------------------------------------------------------------------ */

  function screenLadder(){
    var rows = CFG.ladderPrices.map(function(p){
      return '<tr><td>' + p + ' tokens</td><td>' +
        '<label class="lab"><input type="radio" name="L' + p + '" value="buy"> Buy</label>' +
        '<label class="lab"><input type="radio" name="L' + p + '" value="keep"> Keep</label>' +
        '</td></tr>';
    }).join("");

    app.innerHTML =
      '<div class="card"><h2>One thing before you start</h2>' +
      '<p>Imagine you are offered a single pack at each of the prices below. The odds are the ' +
        'usual ones: <strong>1 in 4</strong> that it holds the lucky card, worth <strong>' +
        CFG.luckyValue + ' tokens</strong>.</p>' +
      '<p>For each price, would you buy that pack, or keep your tokens?</p>' +
      '<p class="small muted">There are no right answers — it depends entirely on how much risk ' +
        'you personally like taking.</p>' +
      '<table class="ladder"><thead><tr><th>Price</th><th>Your choice</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '</div>' +
      '<div class="card"><button id="go">Continue</button>' +
      '<div id="e" class="err hide">Please answer every row.</div></div>';

    el("go").onclick = function(){
      var choices = {}, missing = false;
      CFG.ladderPrices.forEach(function(p){
        var sel = app.querySelector('input[name="L' + p + '"]:checked');
        if (!sel) missing = true; else choices[p] = sel.value;
      });
      if (missing){ el("e").classList.remove("hide"); return; }

      var sorted = CFG.ladderPrices.slice().sort(function(a,b){ return a-b; });
      var sw = null, switches = 0, prev = null;
      sorted.forEach(function(p){
        if (prev !== null && choices[p] !== prev) switches++;
        if (sw === null && choices[p] === "keep") sw = p;
        prev = choices[p];
      });

      S.ladder      = choices;
      S.switchPrice = sw;                // null = would buy at every price offered
      S.consistent  = (switches <= 1);   // more than one switch = inconsistent
      go(function(){ runRound(0, true); });
    };
  }

  /* ---------- 10. A round (practice or scored) ---------- */

  function runRound(i, isPractice){
    var total  = isPractice ? CFG.practiceRounds : CFG.scoredRounds;
    var label  = isPractice ? ("Practice " + (i+1) + " of " + total)
                            : ("Round " + (i+1) + " of " + total);
    var tokens = CFG.endowment;

    app.innerHTML =
      dots(i, total) + topbar(label, tokens) +
      '<div class="card">' +
      (isPractice && i === 0
        ? '<p class="small muted">Two practice rounds first. They work exactly like real rounds, ' +
          'but they do not count towards your score.</p>'
        : '') +
      '<p class="small muted"><strong>Step 1.</strong> Open your free pack.</p>' +
      '<div class="packwrap">' + sealedHTML() + '</div>' +
      '<div style="height:14px"></div><button id="open">Open your pack</button></div>';

    el("open").onclick = function(){
      var first = draw();
      if (first.lucky) tokens += CFG.luckyValue;
      el("pk").outerHTML = cardHTML(first);
      app.querySelector(".tok").textContent = tokens;
      var b = el("open");
      b.textContent = "Continue";
      b.onclick = function(){ decide(i, isPractice, first, tokens, label, total); };
    };
  }

  function decide(i, isPractice, first, tokens, label, total){
    app.innerHTML =
      dots(i, total) + topbar(label, tokens) +
      '<div class="card">' +
      '<p class="small muted"><strong>Step 2.</strong> Your decision.</p>' +
      '<h2>Buy one more pack?</h2>' +
      '<p>It costs <strong>' + CFG.packPrice + ' tokens</strong>. The odds are the same as always: ' +
        '<strong>1 in 4</strong> for the lucky card, worth ' + CFG.luckyValue + ' tokens.</p>' +
      '<p class="small muted">If you keep your tokens, the round ends here.</p>' +
      '<div class="row">' +
        '<button id="buy">Buy a pack — ' + CFG.packPrice + '</button>' +
        '<button id="stop" class="ghost">Keep my tokens</button>' +
      '</div></div>';

    el("stop").onclick = function(){
      finishRound(i, isPractice, first, null, tokens, label, total, false);
    };
    el("buy").onclick = function(){
      var second = draw();
      var t = tokens - CFG.packPrice + (second.lucky ? CFG.luckyValue : 0);
      app.innerHTML =
        dots(i, total) + topbar(label, t) +
        '<div class="card">' +
        '<p class="small muted"><strong>Step 3.</strong> Open the pack you bought.</p>' +
        '<div class="packwrap">' + cardHTML(second) + '</div>' +
        '<div style="height:14px"></div><button id="n">Continue</button></div>';
      el("n").onclick = function(){
        finishRound(i, isPractice, first, second, t, label, total, true);
      };
    };
  }

  /* ---------- 11. End of round: score + the belief that splits the theories ----
     Rational and prospect theory both predict this stays at 25 every round.
     The emotional / confidence story is the one that predicts it moves — up
     after a win, down after a loss. So this single question separates a
     belief channel from a preference channel.
  ------------------------------------------------------------------------ */

  function finishRound(i, isPractice, first, second, score, label, total, bought){
    if (isPractice){
      if (i + 1 < CFG.practiceRounds){ go(function(){ runRound(i+1, true); }); return; }
      app.innerHTML =
        '<div class="card"><h2>That is the whole game</h2>' +
        '<p>Ready for real? The next ' + CFG.scoredRounds + ' rounds count towards your score, ' +
          'and each one starts fresh at ' + CFG.endowment + ' tokens.</p>' +
        '<button id="go">Start round 1</button></div>';
      el("go").onclick = function(){ go(function(){ runRound(0, false); }); };
      return;
    }

    app.innerHTML =
      dots(i + 1, total) + topbar(label + " complete", score) +
      '<div class="card">' +
      '<p>You finished this round with <strong>' + score + ' tokens</strong>.</p></div>' +

      '<div class="card">' +
      '<label for="nb">If you opened another pack right now, out of 100 such packs, how many do ' +
        'you think would contain the lucky card?</label>' +
      '<input id="nb" type="number" min="0" max="100" inputmode="numeric" placeholder="0–100">' +
      '</div>' +

      '<div class="card"><button id="n">' +
        (i + 1 < total ? "Next round" : "Last questions") + '</button>' +
      '<div id="e" class="err hide">Enter a number between 0 and 100.</div></div>';

    el("n").onclick = function(){
      var nb = parseInt(el("nb").value, 10);
      if (isNaN(nb) || nb < 0 || nb > 100){ el("e").classList.remove("hide"); return; }

      S.rounds.push({
        round: i + 1,
        firstCard: first.name,
        firstIsLucky: first.lucky,
        bought: bought,
        secondCard: second ? second.name : null,
        secondIsLucky: second ? second.lucky : null,
        roundScore: score,
        nextPackBelief: nb
      });
      if (i + 1 < CFG.scoredRounds) go(function(){ runRound(i+1, false); });
      else go(screenClosing);
    };
  }

  /* ---------- 12. Closing questions ---------- */

  function screenClosing(){
    app.innerHTML =
      '<div class="card"><h2>Last few questions</h2></div>' +
      '<div class="card">' +
      '<label for="b2">Out of 100 packs, how many do you think contain the lucky card?</label>' +
      '<input id="b2" type="number" min="0" max="100" inputmode="numeric" placeholder="0–100">' +
      '</div>' +
      '<div class="card">' +
      '<label>How familiar are you with collectible card games?</label>' +
      scaleHTML("fam") +
      '<div class="ends"><span>Never played</span><span>I collect regularly</span></div>' +
      '</div>' +
      '<div class="card">' +
      '<label for="cm">Anything you want to say about the game? <span class="muted">(optional)</span></label>' +
      '<textarea id="cm" placeholder="Optional"></textarea>' +
      '</div>' +
      '<div class="card"><button id="fin">Finish</button>' +
      '<div id="e" class="err hide">Please answer the first two questions.</div></div>';

    wireScale("fam", function(v){ S.familiarity = v; });

    el("fin").onclick = function(){
      var v = parseInt(el("b2").value, 10);
      if (isNaN(v) || v < 0 || v > 100 || S.familiarity === null){
        el("e").classList.remove("hide"); return;
      }
      S.beliefEnd  = v;
      S.comment    = el("cm").value.slice(0, 500);
      S.finishedAt = new Date().toISOString();
      go(screenDebrief);
      save();
    };
  }

  /* ---------- 13. Debrief ---------- */

  function bestRound(){
    return S.rounds.reduce(function(m,r){ return Math.max(m, r.roundScore); }, 0);
  }

  function screenDebrief(){
    var best = bestRound();
    var rows = S.rounds.map(function(r){
      var isBest = r.roundScore === best;
      return '<tr' + (isBest ? ' class="best"' : '') + '><td>Round ' + r.round +
             (r.bought ? ' · bought a second pack' : ' · kept tokens') +
             '</td><td>' + r.roundScore + (isBest ? ' ★' : '') + '</td></tr>';
    }).join("");

    app.innerHTML =
      '<div class="card"><h2>Thanks for playing</h2>' +
      '<p>Your player number is below. Keep it — if it wins, it will be posted where you got the link.</p>' +
      '<div class="pid">P' + S.player + '</div>' +
      '<p class="small muted" id="sv">Saving your response…</p>' +
      '</div>' +

      '<div class="card"><h2>Your rounds</h2>' +
      '<table class="sum"><tbody>' + rows + '</tbody></table>' +
      '<p class="small muted" style="margin-top:12px">Best round: <strong>' + best +
        ' tokens</strong> — this is the score entered for the voucher.</p></div>' +

      '<div class="card"><h2>What this was about</h2>' +
      '<p>This study asks whether the card in your <em>free</em> pack changes how willing you are ' +
        'to buy a second one — even though every pack has the same 1 in 4 chance, and one pack ' +
        'tells you nothing about the next.</p>' +
      '<p>In theory it should make no difference at all. Whether it does, and why, is the question.</p>' +
      '<p>Everything you were told was true. Every pack really was one card picked at random from ' +
        'those four, every draw was independent, and the odds never changed at any point.</p>' +
      '<p class="small muted">Questions or curiosity: ' + esc(CFG.contactEmail) + '</p></div>';
  }

  /* ---------- Saving ---------- */

  function payload(){
    return {
      player: S.player,
      beliefStart: S.beliefStart,
      beliefEnd: S.beliefEnd,
      beliefShift: S.beliefEnd - S.beliefStart,
      ladder: S.ladder,
      switchPrice: S.switchPrice,
      ladderConsistent: S.consistent,
      familiarity: S.familiarity,
      comment: S.comment,
      bestRound: bestRound(),
      buysTotal: S.rounds.filter(function(r){ return r.bought; }).length,
      rounds: S.rounds,
      config: CFG,
      startedAt: S.startedAt,
      finishedAt: S.finishedAt
    };
  }

  function save(){
    var note = function(t){ var n = el("sv"); if (n) n.textContent = t; };
    var fallback = "Could not save automatically — please send your player number to " + CFG.contactEmail + ".";

    if (!SAVE_URL){
      note("Test mode — nothing was saved. (Open the browser console to see the data.)");
      if (window.console && console.log) console.log(payload());
      return;
    }
    fetch(SAVE_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload())
    }).then(function(){
      note("Response saved. Thank you.");
    }).catch(function(){
      note(fallback);
    });
  }

  screenWelcome();
})();
</script>
</body>
</html>
